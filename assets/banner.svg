<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="40%" stop-color="#0d1b38" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="35%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Emerald Trend Gradient -->
    <linearGradient id="trendGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.4" />
      <stop offset="30%" stop-color="#10B981" />
      <stop offset="70%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.6" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes floatCoin {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-9px) rotate(4deg); }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes beaconRing {
        0% { r: 6; opacity: 1; stroke-width: 2.5; }
        100% { r: 24; opacity: 0; stroke-width: 0.5; }
      }
      @keyframes shimmerText {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(251, 191, 36, 0.4)); }
        50% { filter: drop-shadow(0 0 16px rgba(251, 191, 36, 0.85)); }
      }
      .shimmer-title {
        animation: shimmerText 4s ease-in-out infinite;
      }
      .chart-dash {
        stroke-dasharray: 8 6;
        animation: dashFlow 20s linear infinite;
      }
      .floating-node {
        animation: floatCoin 5s ease-in-out infinite;
        transform-origin: center;
      }
      .pulse-beacon {
        animation: beaconRing 2.2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="340" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="140" fill="#3B82F6" opacity="0.12" filter="url(#glowCyan)" />
  <circle cx="1020" cy="120" r="180" fill="#10B981" opacity="0.12" filter="url(#glowCyan)" />
  <circle cx="600" cy="300" r="120" fill="#F59E0B" opacity="0.08" filter="url(#glowGold)" />

  <!-- Abstract Dynamic Chart / Flow Trend in Background -->
  <path d="M 50 280 Q 250 270 400 210 T 750 150 T 1000 80 T 1150 50 L 1150 320 L 50 320 Z" fill="url(#trendGrad)" />
  
  <!-- Flow Lines (Representing Foreign Inflows) -->
  <path d="M 50 280 Q 250 270 400 210 T 750 150 T 1000 80 T 1150 50" fill="none" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M 50 280 Q 250 270 400 210 T 750 150 T 1000 80 T 1150 50" fill="none" stroke="#60A5FA" stroke-width="2" class="chart-dash" opacity="0.8" />

  <!-- Floating Dynamic Chart Beacon -->
  <circle cx="1000" cy="80" fill="none" stroke="#34D399" class="pulse-beacon" />
  <circle cx="1000" cy="80" r="6" fill="#10B981" filter="url(#glowGold)" />

  <!-- Top Tech/Economy Badges -->
  <g transform="translate(60, 42)">
    <rect width="210" height="30" rx="15" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="15" r="5" fill="#10B981" />
    <text x="32" y="20" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">MACROECONOMIC BLUEPRINT</text>
  </g>

  <!-- Main Banner Title -->
  <text x="60" y="132" class="shimmer-title" fill="url(#goldGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Montserrat, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
    RAGS-TO-RICHES-SECRETS
  </text>

  <!-- Subtitle / Core Principle -->
  <text x="60" y="172" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500">
    The Mechanics of Sovereign Wealth Creation: Driving Positive Net Foreign Inflows
  </text>

  <!-- Interactive/Dynamic Pill Indicators (5 Core Drivers) -->
  <g transform="translate(60, 220)">
    <!-- Driver 1: Tourism -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" opacity="0.9" />
      <text x="14" y="26" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="bold">✈ 1. NET TOURISM</text>
    </g>

    <!-- Driver 2: Trade -->
    <g transform="translate(195, 0)">
      <rect width="180" height="42" rx="8" fill="#0F172A" stroke="#34D399" stroke-width="1.2" opacity="0.9" />
      <text x="14" y="26" fill="#34D399" font-family="sans-serif" font-size="12" font-weight="bold">🚢 2. NET TRADE</text>
    </g>

    <!-- Driver 3: FDI -->
    <g transform="translate(390, 0)">
      <rect width="180" height="42" rx="8" fill="#0F172A" stroke="#FBBF24" stroke-width="1.2" opacity="0.9" />
      <text x="14" y="26" fill="#FBBF24" font-family="sans-serif" font-size="12" font-weight="bold">🏭 3. NET FDI</text>
    </g>

    <!-- Driver 4: Remittance -->
    <g transform="translate(585, 0)">
      <rect width="185" height="42" rx="8" fill="#0F172A" stroke="#A78BFA" stroke-width="1.2" opacity="0.9" />
      <text x="14" y="26" fill="#A78BFA" font-family="sans-serif" font-size="12" font-weight="bold">💸 4. NET REMITTANCES</text>
    </g>

    <!-- Driver 5: Brain Circulation -->
    <g transform="translate(785, 0)">
      <rect width="210" height="42" rx="8" fill="#0F172A" stroke="#F472B6" stroke-width="1.2" opacity="0.9" />
      <text x="14" y="26" fill="#F472B6" font-family="sans-serif" font-size="12" font-weight="bold">🧠 5. REVERSE BRAIN DRAIN</text>
    </g>
  </g>

  <!-- Right Visual Emblem (Gold Flow Coin & Surge Icon) -->
  <g class="floating-node" transform="translate(1060, 110)">
    <circle cx="0" cy="0" r="52" fill="#1E293B" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glowGold)" />
    <!-- Dynamic Inner Rotation Graphic -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="8 6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite" />
    </circle>
    <!-- Currency Growth / Vault Symbol -->
    <text x="0" y="14" fill="#FCD34D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="bold" text-anchor="middle">$</text>
    <!-- Rising Arrow Indicator -->
    <path d="M 22 18 L 38 2 M 38 2 L 28 2 M 38 2 L 38 12" fill="none" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(60, 286)">
    <text x="0" y="18" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      📊 Comparative Benchmark: <tspan fill="#CBD5E1" font-weight="600">United States</tspan> • <tspan fill="#CBD5E1" font-weight="600">China</tspan> • <tspan fill="#CBD5E1" font-weight="600">India</tspan> | Financial Values &amp; % of GDP
    </text>
  </g>
</svg>
